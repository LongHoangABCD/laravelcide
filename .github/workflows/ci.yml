name: Laravel CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

permissions:
    contents: read
    packages: write

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: mbstring, pdo_mysql, bcmath, gd, zip
                  coverage: none

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Install NPM dependencies
              run: npm ci

            - name: Build frontend
              run: npm run build

            - name: Prepare Laravel
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Run migrations
              run: php artisan migrate --force

            - name: Run tests
              run: php artisan test

    build:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build Docker image
              run: |
                  docker build \
                    -t ghcr.io/longhoangabcd/laravelcide:latest \
                    .

            - name: Push Docker image
              run: |
                  docker push \
                    ghcr.io/${{ github.repository }}:latest
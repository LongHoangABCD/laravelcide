services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_app
        working_dir: /var/www
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            APP_ENV: local
            APP_DEBUG: "true"

            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: laravelcicd
            DB_USERNAME: root
            DB_PASSWORD: root

    node:
        image: node:22-alpine
        container_name: laravel_node
        working_dir: /var/www
        ports:
            - "5173:5173"
        volumes:
            - .:/var/www
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    mysql:
        image: mysql:8.4
        container_name: laravel_mysql
        restart: unless-stopped
        ports:
            - "3307:3306"
        environment:
            MYSQL_DATABASE: laravelcicd
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-uroot",
                    "-proot",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    mysql_data:
